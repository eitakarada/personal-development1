<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CieloEmo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css?family=Sawarabi+Mincho" rel="stylesheet">
    <style>
        body {
            font-family: 'Sawarabi Mincho', serif;
        }
    </style>
    <link rel="stylesheet" href="styles/stars.css">
</head>
<body class="min-h-screen  bg-gradient-to-b from-slate-950 via-indigo-950 to-sky-950">
    <div id="pageMessage" class="fixed top-4 left-1/2 z-20 hidden -translate-x-1/2 rounded-full px-4 py-2 text-sm font-bold shadow-lg"></div>
    <div class="flex flex-col items-center px-4 pt-8">
        <img class="mx-auto -mb-20 sm:-mb-36 h-56 sm:h-96 w-auto" src="./asstes/img/CieloEmo-mainicon.png" alt="CieloEmo">
        <div class="flex flex-col gap-6 sm:gap-8 justify-center mt-20 sm:mt-36 bg-blue-700/30 rounded-lg py-8 px-6 w-full max-w-sm">
            <a href="auth/registar.html" class="bg-[#020617] hover:bg-[#1e1b4b] h-24 sm:h-28 w-full max-w-[12rem] mx-auto rounded-lg flex items-center justify-center transition">
                <span class="bg-gradient-to-r from-yellow-200 via-amber-300 to-yellow-100 bg-clip-text text-transparent font-bold text-2xl">新規登録</span>
            </a>
            <a href="auth/login.html" class="bg-[#020617] hover:bg-[#1e1b4b] h-24 sm:h-28 w-full max-w-[12rem] mx-auto rounded-lg flex items-center justify-center transition">
                <span class="bg-gradient-to-r from-yellow-200 via-amber-300 to-yellow-100 bg-clip-text text-transparent font-bold text-2xl">ログイン</span>
            </a>
        </div>
    </div>
    <script src="scripts/stars.js" defer></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status');
            const message = params.get('message');
            const target = document.getElementById('pageMessage');

            if (!status || !message || !target) return;

            target.textContent = message;
            target.classList.remove('hidden', 'bg-green-500', 'bg-red-500', 'text-white');
            target.classList.add('text-white');
            target.classList.add(status === 'success' ? 'bg-green-500' : 'bg-red-500');
        })();
    </script>
</body>
</html>
