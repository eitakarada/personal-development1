<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>CieloEmo - 新規登録</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://fonts.googleapis.com/css?family=Sawarabi+Mincho" rel="stylesheet">
	<link rel="stylesheet" href="../styles/stars.css">
	<style>body{font-family:'Sawarabi Mincho',serif;}</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-950 via-indigo-950 to-sky-950">
	<main class="flex items-center justify-center min-h-screen p-4">
		<div class="bg-[#020617]/80 p-6 sm:p-8 rounded-lg w-full max-w-sm">
			<h1 class="text-2xl font-bold text-center text-white mb-6">新規登録</h1>
			<form id="registerForm" action="../api/register.php" method="post">
				<label class="block text-sm text-gray-200">ユーザー名
					<input id="usernameInput" name="username" type="text" placeholder="ユーザー名を入力" class="mt-1 w-full rounded px-3 py-2 bg-[#191970] text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-400 [&:not(:placeholder-shown)]:text-yellow-300" required>
				</label>
				<label class="block text-sm text-gray-200 mt-4">メールアドレス
					<input id="emailInput" name="email" type="email" placeholder="example@mail.com" class="mt-1 w-full rounded px-3 py-2 bg-[#191970] text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-400 [&:not(:placeholder-shown)]:text-yellow-300" required>
				</label>
				<label class="block text-sm text-gray-200 mt-4">パスワード
					<input id="passwordInput" name="password" type="password" placeholder="6文字以上で入力" class="mt-1 w-full rounded px-3 py-2 bg-[#191970] text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-400 [&:not(:placeholder-shown)]:text-yellow-300" required>
				</label>
				<div id="regMessage" class="mt-3 text-sm"></div>
				<div class="mt-6">
					<button type="submit" class="w-full bg-yellow-400 text-black font-bold py-2 rounded">登録する</button>
				</div>
			</form>
			<div class="mt-4 text-center bg-[#393f4c] hover:bg-[#191970]">
				<a href="../index.html" class="text-sm text-gray-300 hover:underline">トップに戻る</a>
			</div>
		</div>
	</main>
	<script src="../scripts/stars.js" defer></script>
	<script>
		(function () {
			const params = new URLSearchParams(window.location.search);
			const status = params.get('status');
			const message = params.get('message');
			const target = document.getElementById('regMessage');
			if (!status || !message || !target) return;
			target.textContent = message;
			target.classList.remove('text-green-400', 'text-red-400', 'text-gray-300');
			target.classList.add(status === 'success' ? 'text-green-400' : 'text-red-400');
		})();
	</script>
</body>
</html>
