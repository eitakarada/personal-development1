<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>新規登録</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://fonts.googleapis.com/css?family=Sawarabi+Mincho" rel="stylesheet">
	<link rel="stylesheet" href="../styles/stars.css">
	<style>body{font-family:'Sawarabi Mincho',serif;}</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-950 via-indigo-950 to-sky-950">
	<main class="flex items-center justify-center min-h-screen">
		<div class="bg-[#020617]/80 p-8 rounded-lg w-96">
			<h1 class="text-2xl font-bold text-center text-white mb-6">新規登録</h1>
			<form>
				<label class="block text-sm text-gray-200">ユーザー名
					<input type="text" class="mt-1 w-full rounded px-3 py-2 bg-[#0b1220] text-white" required>
				</label>
				<label class="block text-sm text-gray-200 mt-4">メールアドレス
					<input type="email" class="mt-1 w-full rounded px-3 py-2 bg-[#0b1220] text-white" required>
				</label>
				<label class="block text-sm text-gray-200 mt-4">パスワード
					<input type="password" class="mt-1 w-full rounded px-3 py-2 bg-[#0b1220] text-white" required>
				</label>
				<div class="mt-6">
					<button type="submit" class="w-full bg-yellow-400 text-black font-bold py-2 rounded">登録する</button>
				</div>
			</form>
			<div class="mt-4 text-center">
				<a href="../index.html" class="text-sm text-gray-300 hover:underline">トップに戻る</a>
			</div>
		</div>
	</main>
	<script src="../scripts/stars.js" defer></script>
</body>
</html>
